name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  check:
    # every system the app ships on: each bundles its own build of ffmpeg, and the audio tests run against it
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
