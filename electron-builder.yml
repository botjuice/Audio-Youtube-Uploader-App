appId: com.umoandco.yoosyjoosy
productName: Yoosy Joosy
directories:
  buildResources: resources
  output: dist
files:
  - out/**
  - package.json
  - '!**/*.map'
asarUnpack:
  - node_modules/ffmpeg-static/**
mac:
  category: public.app-category.video
  target: [dmg, zip]
  artifactName: yoosy-joosy-${version}-mac-${arch}.${ext}
  hardenedRuntime: false
  gatekeeperAssess: false
win:
  target: [nsis]
  artifactName: yoosy-joosy-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
linux:
  target: [AppImage]
  artifactName: yoosy-joosy-${version}-linux-${arch}.${ext}
  category: AudioVideo
npmRebuild: false
publish:
  provider: github
  owner: botjuice
  repo: Audio-Youtube-Uploader-App
  releaseType: release
