<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Thumbnail template — 1280×720 (rendered by the thumbnail plugin)</title>
<style>
  /* ---------- Fonts ---------- */
  @font-face { font-family: "surah-name-v4-icon"; src: url("fonts/surah-name-v4.ttf") format("truetype"); font-display: block; }   /* V4 Surah Name Font (QUL / Tarteel) — ligature font */
  /* Bundled text fonts are declared by the plugin (fonts.ts → bundledFontFaceCss) into #bundled-fonts;
     the two below are the locked defaults so the template also renders on its own. */
  @font-face { font-family: "amiri"; src: url("fonts/Amiri-Bold.ttf") format("truetype"); font-weight: 700; font-display: block; }
  @font-face { font-family: "ibm-plex-sans-arabic"; src: url("fonts/IBMPlexSansArabic-Medium.ttf") format("truetype"); font-weight: 500; font-display: block; }

  /* ---------- Style variables ----------
     Every value below is set by the plugin from the style knobs (style.ts → cssVars). The
     fallbacks here are the locked defaults so the template also renders on its own. */
  :root {
    --canvas-w: 1280px;
    --canvas-h: 720px;
    --safe: 24px;
    --min-fit: 0.55;
    --group-scale: 1;          /* set by the fit pass when the whole group must shrink to fit the safe room */
    --canvas-bg: rgba(11, 26, 38, 1);
    /* photo */
    --photo-position: 50% 50%;
    --photo-transform: scale(1);
    --photo-filter: none;
    --grain-opacity: 0;
    --overlay-bg:
      radial-gradient(58% 60% at 50% 52%, rgba(11, 26, 38, 0.30) 0%, rgba(11, 26, 38, 0) 100%),
      radial-gradient(120% 90% at 50% 40%, rgba(11, 26, 38, 0) 0%, rgba(11, 26, 38, 0.45) 100%),
      linear-gradient(180deg, rgba(11, 26, 38, 0.22) 0%, rgba(11, 26, 38, 0.46) 45%, rgba(11, 26, 38, 0.84) 100%);
    /* text group */
    --text-offset-x: 0px;
    --text-offset-y: -30px;
    --title-max-w: 1040px;
    --secondary-max-w: 1000px;
    --gap-above-title: 10px;
    --gap-below-title: 24px;
    --text-shadow: 2px 12px rgba(0, 0, 0, 0.55);
    --meta-shadow: 2px 10px rgba(0, 0, 0, 0.55);
    /* title */
    --title-color: rgba(214, 179, 60, 1);
    --title-gradient: linear-gradient(180deg, #EBD27A 0%, #D6B33C 55%, #B9962B 100%);
    --title-size: 290px;
    --title-opacity: 1;
    --title-filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.45)) drop-shadow(0 10px 28px rgba(0, 0, 0, 0.45)) drop-shadow(0 0 22px rgba(235, 210, 122, 0.30));
    --surah-word-display: inline-block;
    --surah-word-scale: 1em;
    --title-gap: 0.14em;
    --join-scale: 0.38em;
    --outline-display: none;
    --outline-stroke: 0px transparent;
    /* reciter */
    --reciter-font: "amiri"; --reciter-weight: 700;
    --meta-font: "ibm-plex-sans-arabic"; --meta-weight: 500;
    --reciter-display: block;
    --reciter-color: rgba(244, 239, 227, 1);
    --reciter-size: 52px;
    --reciter-opacity: 1;
    --reciter-spacing: 0em;
    --reciter-pill-bg: transparent; --reciter-pill-radius: 16px; --reciter-pill-px: 0px; --reciter-pill-py: 0px;
    /* meta */
    --meta-display: flex;
    --meta-color: rgba(244, 239, 227, 0.82);
    --meta-size: 36px;
    --meta-gap: 0.55em;
    --meta-spacing: 0em;
    --prayer-display: inline; --prayer-opacity: 1;
    --date-display: inline; --date-opacity: 1;
    --sep-display: block; --sep-size: 7px; --sep-color: rgba(235, 210, 122, 1);
    --meta-pill-bg: transparent; --meta-pill-radius: 16px; --meta-pill-px: 0px; --meta-pill-py: 0px;
    /* dividers */
    --div-above-display: none; --div-above-width: 120px; --div-above-height: 3px; --div-above-bg: none;
    --div-below-display: none; --div-below-width: 120px; --div-below-height: 3px; --div-below-bg: none;
    /* frame */
    --frame-display: none; --frame-border: 0 solid transparent; --frame-inset: 24px; --frame-radius: 0px;
  }

  html, body { margin: 0; padding: 0; background: #000; }

  /* ---------- Canvas ---------- */
  .thumb {
    position: relative; width: var(--canvas-w); height: var(--canvas-h); overflow: hidden;
    background: var(--canvas-bg); -webkit-font-smoothing: antialiased;
  }
  .thumb__photo {
    position: absolute; inset: 0; width: 100%; height: 100%; display: block;
    object-fit: cover; object-position: var(--photo-position);
    transform: var(--photo-transform); transform-origin: var(--photo-position);
    filter: var(--photo-filter);
  }
  .thumb__grain {
    position: absolute; inset: 0; opacity: var(--grain-opacity); pointer-events: none; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 1 0'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>");
    background-size: 300px 300px;
  }
  .thumb__overlay { position: absolute; inset: 0; background: var(--overlay-bg); }
  .thumb__frame {
    display: var(--frame-display); position: absolute; inset: var(--frame-inset);
    border: var(--frame-border); border-radius: var(--frame-radius); pointer-events: none;
  }

  /* ---------- Text group ---------- */
  .thumb__content {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 0 40px; box-sizing: border-box;
  }
  .divider { height: var(--div-above-height); border-radius: 4px; flex: none; }
  .divider--above { display: var(--div-above-display); width: calc(var(--div-above-width) * var(--group-scale)); height: calc(var(--div-above-height) * var(--group-scale)); background: var(--div-above-bg); margin-bottom: calc(var(--gap-above-title) * var(--group-scale)); }
  .divider--below { display: var(--div-below-display); width: calc(var(--div-below-width) * var(--group-scale)); height: calc(var(--div-below-height) * var(--group-scale)); background: var(--div-below-bg); margin-bottom: calc(var(--gap-below-title) * var(--group-scale)); }

  /* Surah title: "سورة" + name on one row (two surahs: name و name, no "سورة") */
  .title-wrap { position: relative; margin-bottom: calc(var(--gap-below-title) * var(--group-scale)); }
  .title {
    display: flex; flex-direction: row; align-items: baseline; justify-content: center;
    gap: var(--title-gap);                    /* the font's space glyph is zero-width */
    max-width: var(--title-max-w);
    font-family: "surah-name-v4-icon";        /* no fallback on purpose */
    font-size: var(--title-size); line-height: 1; white-space: nowrap;
    color: var(--title-color); opacity: var(--title-opacity);
    font-variant-ligatures: common-ligatures; text-rendering: optimizeLegibility;
    filter: var(--title-filter);
  }
  .title > span {
    font-family: inherit; display: inline-block;
    background: var(--title-gradient); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .title > [data-code="surah-icon"] { display: var(--surah-word-display); font-size: var(--surah-word-scale); }
  .title .title__and { font-family: "Amiri", serif; font-weight: 700; font-size: var(--join-scale); align-self: center; }
  /* Outline: a copy of the title underneath with a stroke; the gradient title covers the inner half */
  .title--outline {
    display: var(--outline-display); position: absolute; inset: 0; filter: none; opacity: var(--title-opacity);
    -webkit-text-stroke: var(--outline-stroke); paint-order: stroke fill;
  }
  .title--outline > span { background: none; -webkit-text-fill-color: transparent; }
  /* NOTE: never set letter-spacing, word-spacing or text-transform on .title — the ligature font breaks */

  .reciter {
    display: var(--reciter-display); max-width: var(--secondary-max-w);
    font-family: var(--reciter-font); font-weight: var(--reciter-weight); font-synthesis: none; font-size: var(--reciter-size); line-height: 1.35; white-space: nowrap;
    color: var(--reciter-color); opacity: var(--reciter-opacity); letter-spacing: var(--reciter-spacing);
    text-shadow: 0 var(--text-shadow);
    margin: 0 0 calc(var(--gap-above-title) * var(--group-scale));
    background: var(--reciter-pill-bg); border-radius: var(--reciter-pill-radius); padding: calc(var(--reciter-pill-py) * var(--group-scale)) calc(var(--reciter-pill-px) * var(--group-scale));
  }
  .meta {
    display: var(--meta-display); flex-direction: row; align-items: center; justify-content: center; gap: var(--meta-gap);
    max-width: var(--secondary-max-w);
    font-family: var(--meta-font); font-weight: var(--meta-weight); font-synthesis: none; font-size: var(--meta-size); line-height: 1.4; white-space: nowrap;
    color: var(--meta-color); letter-spacing: var(--meta-spacing);
    text-shadow: 0 var(--meta-shadow);
    background: var(--meta-pill-bg); border-radius: var(--meta-pill-radius); padding: calc(var(--meta-pill-py) * var(--group-scale)) calc(var(--meta-pill-px) * var(--group-scale));
  }
  .meta [data-slot="prayer"] { display: var(--prayer-display); opacity: var(--prayer-opacity); }
  .meta [data-slot="date"] { display: var(--date-display); opacity: var(--date-opacity); }
  /* Render stamp: a 2px block in the corner whose colour encodes the render id. The plugin accepts a
     captured frame only when it carries the current id, then scrubs these pixels from the output. */
  .stamp { position: absolute; right: 0; bottom: 0; width: 2px; height: 2px; z-index: 99; background: #000; }
  .meta__dot { display: var(--sep-display); width: var(--sep-size); height: var(--sep-size); border-radius: 50%; background: var(--sep-color); flex: none; }
</style>
<style id="bundled-fonts"></style>
</head>
<body>

<div class="thumb" id="thumb">
  <img class="thumb__photo" data-slot="photo" alt="">
  <div class="thumb__grain"></div>
  <div class="thumb__overlay"></div>
  <div class="thumb__frame"></div>
  <div class="stamp" id="stamp"></div>

  <div class="thumb__content">
    <div class="reciter line" dir="rtl" data-slot="reciter_name" data-fit="reciter"></div>
    <div class="divider divider--above line"></div>
    <div class="title-wrap line">
      <div class="title title--outline" dir="rtl" aria-hidden="true"></div>
      <div class="title" dir="rtl" data-fit="title">
        <span class="title__word" data-code="surah-icon">surah-icon</span>
        <span class="title__word" data-slot="surah_name"></span>
      </div>
    </div>
    <div class="divider divider--below line"></div>
    <div class="meta line" dir="rtl" data-fit="meta">
      <span data-slot="prayer"></span>
      <span class="meta__dot" aria-hidden="true"></span>
      <span data-slot="date"></span>
    </div>
  </div>
</div>

<script>
(function () {
  const root = document.getElementById("thumb");
  const q = (sel) => root.querySelector(sel);
  const visible = (el) => getComputedStyle(el).display !== "none";

  /* surah number → ligature code, e.g. 2 → "surah002" */
  function surahCode(n) {
    const num = Math.min(114, Math.max(1, parseInt(n, 10) || 1));
    return "surah" + String(num).padStart(3, "0");
  }

  /* Apply the plugin's CSS variables (all of them, every render) */
  function applyVars(vars) {
    const st = document.documentElement.style;
    for (const [k, v] of Object.entries(vars || {})) st.setProperty(k, v);
  }

  /* Fill the slots from a data object */
  function fill(d) {
    q('[data-slot="photo"]').src = d.photo;
    const list = d.surahs || [d.surah];
    const title = q('.title[data-fit="title"]');
    // Scope slot lookups to the real title: the outline layer holds clones of these spans.
    const slot = title.querySelector('[data-slot="surah_name"]');
    title.querySelectorAll('.title__extra').forEach((e) => e.remove());
    const icon = title.querySelector('[data-code="surah-icon"]');
    icon.dataset.multi = list.length > 1 ? "1" : "";
    icon.style.display = list.length > 1 ? "none" : "";     // two surahs: the word «سورة» is dropped
    slot.textContent = surahCode(list[0]);
    list.slice(1).forEach((n) => {
      const and = document.createElement("span"); and.className = "title__word title__extra title__and"; and.textContent = "و";
      const w = document.createElement("span"); w.className = "title__word title__extra"; w.textContent = surahCode(n);
      title.append(and, w);
    });
    // outline layer mirrors the title's spans
    const outline = q(".title--outline");
    outline.innerHTML = "";
    for (const sp of title.children) {
      const c = sp.cloneNode(true);
      for (const a of ["data-slot", "data-code", "data-fit"]) c.removeAttribute(a);
      outline.append(c);
    }
    q('[data-slot="reciter_name"]').textContent = d.reciter_name;
    q('[data-slot="prayer"]').textContent       = d.prayer;
    q('[data-slot="date"]').textContent         = d.date;
  }

  /* Shrink-to-fit: each data-fit element has a max box (max-width). The title is one unit. */
  const BASE = { title: "--title-size", reciter: "--reciter-size", meta: "--meta-size" };
  function fitAll(groupScale) {
    const cs = getComputedStyle(root);
    const fit = { group: groupScale }; window.__fit = fit;
    root.querySelectorAll("[data-fit]").forEach((el) => {
      if (!visible(el)) { fit[el.dataset.fit] = 1; return; }
      const base = parseFloat(cs.getPropertyValue(BASE[el.dataset.fit])) * groupScale;
      el.style.fontSize = base + "px";
      const maxW = parseFloat(getComputedStyle(el).maxWidth);
      const w = el.scrollWidth;
      const ratio = w > maxW ? maxW / w : 1;
      if (ratio < 1) el.style.fontSize = Math.floor(base * ratio * 100) / 100 + "px";
      fit[el.dataset.fit] = ratio * groupScale;          // effective ratio vs. the unscaled base
    });
    q(".title--outline").style.fontSize = q('.title[data-fit="title"]').style.fontSize;
  }

  /* Fit the whole group into the safe room: each line fits its own box first; if the group is still
     wider or taller than the room, scale every line (and gaps, pills, dividers) down together, down to
     --min-fit. Beyond that the plugin refuses the render (layout.overflow). */
  function fitGroup() {
    const cs = getComputedStyle(root);
    const safe = parseFloat(cs.getPropertyValue("--safe")) || 24;
    const minFit = parseFloat(cs.getPropertyValue("--min-fit")) || 0.55;
    const roomW = root.clientWidth - 2 * safe, roomH = root.clientHeight - 2 * safe;
    let scale = 1;
    document.documentElement.style.setProperty("--group-scale", "1");
    for (let i = 0; i < 6; i++) {
      fitAll(scale);
      placeGroup();
      const l = window.__layout;
      if (!l.lines) { l.overflow = false; return; }
      const w = l.inkRight - l.inkLeft, h = l.inkBottom - l.inkTop;
      const need = Math.min(1, roomW / w, roomH / h);
      if (need >= 0.999) { l.overflow = false; return; }
      if (scale <= minFit + 1e-6) { l.overflow = true; return; }
      scale = Math.max(minFit, scale * need * 0.995);     // tiny margin so rounding can't leave it 1px over
      document.documentElement.style.setProperty("--group-scale", String(scale));
    }
    window.__layout.overflow = true;
  }

  /* Visible ink of a text element: baseline from a zero-size probe, extent by drawing on a canvas. */
  const cv = document.createElement("canvas"), ctx = cv.getContext("2d", { willReadFrequently: true });
  function inkOf(el) {
    const cs = getComputedStyle(el);
    const probe = document.createElement("span");
    probe.style.cssText = "display:inline-block;width:0;height:0;vertical-align:baseline";
    el.appendChild(probe);
    const baseline = probe.getBoundingClientRect().bottom;
    probe.remove();
    const size = parseFloat(cs.fontSize);
    ctx.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
    const w = Math.ceil(ctx.measureText(el.textContent).width) + 40;
    cv.width = w; cv.height = Math.ceil(size * 3);
    ctx.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
    ctx.direction = "rtl"; ctx.textAlign = "right";
    const by = Math.round(size * 1.6);
    ctx.fillStyle = "#000"; ctx.fillText(el.textContent, w - 20, by);
    const px = ctx.getImageData(0, 0, cv.width, cv.height).data;
    let top = -1, bottom = -1;
    for (let y = 0; y < cv.height; y++) {
      let hit = false;
      for (let x = 3; x < cv.width * 4; x += 4) if (px[y * cv.width * 4 + x] > 16) { hit = true; break; }
      if (hit) { if (top < 0) top = y; bottom = y; }
    }
    return { top: baseline - (by - top), bottom: baseline + (bottom - by) };
  }

  /* Vertical ink bounds of a line: text lines by their glyph ink (+ pill padding), others by their box. */
  function lineBounds(line) {
    const rect = line.getBoundingClientRect();
    const fitEl = line.matches("[data-fit]") ? line : line.querySelector("[data-fit]");
    if (!fitEl) return { top: rect.top, bottom: rect.bottom, left: rect.left, right: rect.right };
    const cs = getComputedStyle(fitEl);
    // A visible pill is a drawn box: keep the whole box inside the safe area, not just the glyph ink.
    const pillOn = cs.backgroundColor && !/^rgba\(\d+, \d+, \d+, 0\)$|^transparent$/.test(cs.backgroundColor);
    if (pillOn) { const r = fitEl.getBoundingClientRect(); return { top: r.top, bottom: r.bottom, left: r.left, right: r.right }; }
    const spans = [...fitEl.querySelectorAll("span")].filter((s) => s.textContent.trim() && visible(s));
    const inks = (spans.length ? spans : [fitEl]).map(inkOf);
    return { top: Math.min(...inks.map((i) => i.top)), bottom: Math.max(...inks.map((i) => i.bottom)), left: rect.left, right: rect.right };
  }

  /* Centre the group's visible ink on the canvas, apply the offsets, then keep it inside the safe area. */
  function placeGroup() {
    const content = q(".thumb__content");
    content.style.transform = "";
    const lines = [...content.querySelectorAll(".line")].filter(visible);
    const canvas = root.getBoundingClientRect();
    const cs = getComputedStyle(root);
    const offX = parseFloat(cs.getPropertyValue("--text-offset-x")) || 0;
    const offY = parseFloat(cs.getPropertyValue("--text-offset-y")) || 0;
    const safe = parseFloat(cs.getPropertyValue("--safe")) || 24;
    if (lines.length === 0) { window.__layout = { lines: 0, clamped: false }; return; }
    const b = lines.map(lineBounds);
    const top = Math.min(...b.map((x) => x.top)), bottom = Math.max(...b.map((x) => x.bottom));
    const left = Math.min(...b.map((x) => x.left)), right = Math.max(...b.map((x) => x.right));
    let dy = (canvas.top + canvas.height / 2) - (top + bottom) / 2 + offY;
    let dx = offX;
    // safe area: pull back (not shrink) if an offset + size combination would leave the canvas
    let clamped = false;
    const lo = canvas.top + safe, hi = canvas.bottom - safe;
    if (bottom - top <= hi - lo) {
      if (top + dy < lo) { dy = lo - top; clamped = true; }
      if (bottom + dy > hi) { dy = hi - bottom; clamped = true; }
    } else { dy = (lo + hi) / 2 - (top + bottom) / 2; clamped = true; }   // taller than the safe area: centre it
    const l2 = canvas.left + safe, r2 = canvas.right - safe;
    if (right - left <= r2 - l2) {
      if (left + dx < l2) { dx = l2 - left; clamped = true; }
      if (right + dx > r2) { dx = r2 - right; clamped = true; }
    } else { dx = 0; clamped = true; }
    content.style.transform = `translate(${dx.toFixed(1)}px, ${dy.toFixed(1)}px)`;
    window.__layout = {
      lines: lines.length, clamped,
      inkTop: Math.round(top - canvas.top + dy), inkBottom: Math.round(bottom - canvas.top + dy),
      inkLeft: Math.round(left - canvas.left + dx), inkRight: Math.round(right - canvas.left + dx),
    };
  }

  /* Load the plugin's bundled @font-face block once, and any custom font files for this render. */
  const customFaces = {};   // line → FontFace
  async function loadFonts(d) {
    const errors = {};
    if (d.bundledCss && !window.__bundledLoaded) { document.getElementById("bundled-fonts").textContent = d.bundledCss; window.__bundledLoaded = true; }
    for (const line of ["reciter", "meta"]) {
      const url = d.customFonts && d.customFonts[line];
      const family = `custom-${line}`;
      if (customFaces[line]) { document.fonts.delete(customFaces[line]); delete customFaces[line]; }
      if (!url) continue;
      try {
        const face = new FontFace(family, `url("${url}")`);
        await face.load();
        document.fonts.add(face); customFaces[line] = face;
      } catch (e) { errors[line] = `could not load the font file (${e && e.message ? e.message : e})`; }
    }
    return errors;
  }

  /* Does the family actually draw Arabic? Compare against a family that does not exist (pure fallback). */
  const probeCv = document.createElement("canvas"), probeCtx = probeCv.getContext("2d", { willReadFrequently: true });
  function drawsArabic(family, weight) {
    const sample = "الشيخعبدالله١٤٤٦";   // letters + digits only: a space glyph would make any font "differ"
    const paint = (fam) => {
      probeCv.width = 420; probeCv.height = 90;
      probeCtx.clearRect(0, 0, 420, 90);
      probeCtx.font = `${weight} 40px ${fam}`; probeCtx.direction = "rtl"; probeCtx.textAlign = "right"; probeCtx.fillStyle = "#000";
      probeCtx.fillText(sample, 410, 60);
      return probeCtx.getImageData(0, 0, 420, 90).data;
    };
    const a = paint(`"${family}", "no-such-family-zz"`), b = paint(`"no-such-family-zz"`);
    for (let i = 3; i < a.length; i += 4) if (a[i] !== b[i]) return true;
    return false;
  }

  function imagesReady() {
    return Promise.all([...root.querySelectorAll("img")].map((img) =>
      img.complete && img.naturalWidth ? Promise.resolve() : new Promise((res) => { img.onload = img.onerror = res; })));
  }

  async function render(d, vars) {
    root.removeAttribute("data-ready");
    applyVars(vars);
    fill(d);
    await document.fonts.ready;
    await Promise.all([
      document.fonts.load('290px "surah-name-v4-icon"'),
      document.fonts.load('700 52px "amiri"'),
      document.fonts.load('500 36px "ibm-plex-sans-arabic"'),
    ]);
    const fontErrors = await loadFonts(d);
    await document.fonts.ready;
    const cs = getComputedStyle(root);
    for (const line of ["reciter", "meta"]) {
      if (fontErrors[line]) continue;
      const fam = cs.getPropertyValue(`--${line}-font`).trim().replace(/^"|"$/g, "");
      const weight = cs.getPropertyValue(`--${line}-weight`).trim() || "400";
      try { await document.fonts.load(`${weight} 40px "${fam}"`); } catch (e) { /* reported below */ }
      if (!document.fonts.check(`${weight} 40px "${fam}"`)) fontErrors[line] = `font "${fam}" is not available`;
      else if (!drawsArabic(fam, weight)) fontErrors[line] = `font "${fam}" has no Arabic glyphs`;
    }
    window.__fontErrors = fontErrors;
    await imagesReady();
    window.__fontOk = document.fonts.check('290px "surah-name-v4-icon"');
    fitGroup();
    // Stamp LAST, in the same task as the final layout: any frame carrying this id shows the finished DOM.
    const id = (d.renderId | 0) & 511;
    document.getElementById("stamp").style.background = `rgb(${id & 7}, ${(id >> 3) & 7}, ${(id >> 6) & 7})`;
    root.setAttribute("data-ready", "true");
  }

  window.renderThumbnail = render;
  if (window.THUMB_DATA) render(window.THUMB_DATA, window.THUMB_VARS);
})();
</script>
</body>
</html>
